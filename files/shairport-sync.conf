# AirPlay name shown in the picker. Change NAME, then mirror it as
# host-name= in the chroot's etc/avahi/avahi-daemon.conf before packing.
general = { name = "Speaker"; port = 7000; };
# Direct hardware output. No mixer_control_name: the chroot ALSA cannot see
# the host mixer, so iPhone volume stays software-only (by design).
alsa = { output_device = "plughw:AMLAUGESOUND,2"; };
